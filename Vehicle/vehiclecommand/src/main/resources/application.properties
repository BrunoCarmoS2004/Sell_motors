spring.application.name=vehiclecommand

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE

db.server.ip=localhost
db.server.port=5432

# Configuração do Master Database (PostgreSQL)
multitenancy.mtapp.master.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sell_motors_vehicles
multitenancy.mtapp.master.datasource.username=${DB_USERNAME:sellmotors}
multitenancy.mtapp.master.datasource.password=${DB_PASSWORD:sellmotors}
multitenancy.mtapp.master.datasource.driverClassName=org.postgresql.Driver

# Configurações do Pool (HikariCP)
multitenancy.mtapp.master.datasource.connectionTimeout=20000
multitenancy.mtapp.master.datasource.maxPoolSize=20
multitenancy.mtapp.master.datasource.minIdle=5
multitenancy.mtapp.master.datasource.idleTimeout=300000
multitenancy.mtapp.master.datasource.poolName=masterdb-pool-sell_motors_vehicles

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_HTTP:http}://${JWT_URL:localhost:8082}/authcommand/oauth2/jwks

# Configuração EUREKA
eureka.client.service-url.defaultZone=http://sellmotors:sellmotors@localhost:8081/eureka
eureka.instance.instance-id=${spring.application.name}:${random.int}
server.port=0

#RABBIT MQ CONFIGURATION****************
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=sellmotors
spring.rabbitmq.password=sellmotors
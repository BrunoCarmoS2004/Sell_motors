spring.application.name=sync

#RABBIT MQ CONFIG
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=sellmotors
spring.rabbitmq.password=sellmotors

# MongoDB Config

spring.data.mongodb.database=sell-motors-query
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.username=sellmotors
spring.data.mongodb.password=sellmotors

# Configuração EUREKA
eureka.client.service-url.defaultZone=http://localhost:8081/eureka
eureka.instance.instance-id=${spring.application.name}:${random.int}
server.port=0
services:
  postgres:
    image: postgres:16
    container_name: sellmotors-postgres
    environment:
      POSTGRES_DB: sell_motors_master
      POSTGRES_USER: sellmotors
      POSTGRES_PASSWORD: sellmotors
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellmotors -d sell_motors_master"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

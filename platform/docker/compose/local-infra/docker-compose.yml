services:
  postgres:
    image: postgres:16
    container_name: sellmotors-postgres
    environment:
      POSTGRES_DB: sell_motors_master
      POSTGRES_USER: sellmotors
      POSTGRES_PASSWORD: sellmotors
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellmotors -d sell_motors_master"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: sellmotors-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: sellmotors
      MONGO_INITDB_ROOT_PASSWORD: sellmotors
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username sellmotors --password sellmotors --authenticationDatabase admin --eval \"db.runCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sellmotors-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sellmotors
      RABBITMQ_DEFAULT_PASS: sellmotors
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  mongodb-data:
  rabbitmq-data: